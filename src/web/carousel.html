    let currentSlide = 0;
    const urlParams = new URLSearchParams(window.location.search);
    const initialSlide = parseInt(urlParams.get('slide'), 10);
    if (!isNaN(initialSlide) && initialSlide >= 1 && initialSlide <= slidesData.length) {
      currentSlide = initialSlide - 1;

    const carouselFrame = document.getElementById('carousel-frame');
    const slideIndicator = document.getElementById('slide-indicator');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnToggleView = document.getElementById('btn-toggle-view');

    const gridView = document.getElementById('grid-view');

    function updateCarousel() {
      carouselFrame.innerHTML = renderSlideHTML(slidesData[currentSlide]);
      slideIndicator.textContent = `Slide ${currentSlide + 1} of ${slidesData.length}`;
      btnPrev.disabled = currentSlide === 0;
      btnNext.disabled = currentSlide === slidesData.length - 1;
    }

    btnPrev.addEventListener('click', () => {
      if (currentSlide > 0) {
        currentSlide--;
        updateCarousel();
      }
    });

    btnNext.addEventListener('click', () => {
      if (currentSlide < slidesData.length - 1) {
        currentSlide++;
        updateCarousel();
      }
    });

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' && currentSlide < slidesData.length - 1) {
        currentSlide++;
        updateCarousel();
      } else if (e.key === 'ArrowLeft' && currentSlide > 0) {
        currentSlide--;
        updateCarousel();
      }
    });

    let isGrid = false;
    btnToggleView.addEventListener('click', () => {
      isGrid = !isGrid;
      if (isGrid) {
        singleView.classList.add('hidden');
        gridView.classList.remove('hidden');
        gridView.innerHTML = slidesData.map(s => renderSlideHTML(s)).join('');
        btnToggleView.textContent = 'Switch to Carousel View';
      } else {
        gridView.classList.add('hidden');
        singleView.classList.remove('hidden');
        btnToggleView.textContent = 'Switch to Grid View';
        updateCarousel();
      }
    });

    updateCarousel();
  </script>
</body>
</html>
